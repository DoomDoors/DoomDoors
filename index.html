  :root:not([data-theme="light"]){ --bg:#15151a; --panel:#1f1f27; --ink:#eee9e2; --dim:#8f8f9c; }

:root[data-theme="dark"]{ --bg:#15151a; --panel:#1f1f27; --ink:#eee9e2; --dim:#8f8f9c; }
:root{ --bg:#15151a; --panel:#1f1f27; --ink:#eee9e2; --dim:#8f8f9c; }
*{box-sizing:border-box;image-rendering:pixelated}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:'Press Start 2P',monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;justify-content:center;min-height:100%;
  overflow-x:hidden;position:relative;
}
body::before{content:'';position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(circle at 15% 20%, rgba(255,80,120,.16), transparent 40%),
    radial-gradient(circle at 85% 15%, rgba(80,160,255,.15), transparent 40%),
    radial-gradient(circle at 50% 90%, rgba(190,80,255,.14), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(255,200,60,.12), transparent 40%),
    radial-gradient(circle at 10% 80%, rgba(80,255,180,.1), transparent 40%);
}
.chain{position:fixed;top:0;width:7px;height:150px;z-index:-1;opacity:.55;
  background:repeating-linear-gradient(to bottom,#6b6b78 0 6px,#3a3a44 6px 8px,transparent 8px 12px,#6b6b78 12px 18px,#3a3a44 18px 20px,transparent 20px 24px);
  image-rendering:pixelated}
.chain.left{left:6%} .chain.right{right:6%}
.candle{width:10px;height:24px;background:#e8ddc0;margin:0 auto 14px;position:relative}
.candle::before{content:'';position:absolute;left:-2px;right:-2px;top:-3px;height:4px;background:#c9bd98}
.candle::after{content:'';position:absolute;top:-13px;left:1px;width:8px;height:13px;
  background:radial-gradient(circle at 50% 30%,#fff2b0,#ff9d3d 60%,#c04d1a);
  border-radius:50% 50% 50% 50%/60% 60% 40% 40%;box-shadow:0 0 14px 4px rgba(255,157,61,.55);
  animation:flicker 1.6s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1)}50%{transform:scale(.88,1.08)}}
.rainbow-bar{height:6px;width:70%;max-width:260px;margin:0 auto 26px;
  background:linear-gradient(90deg,#ff4d4d,#ff9d3d,#ffe14d,#7fe84f,#4dc0ff,#5b6bff,#b34dff)}
#app{width:100%;max-width:640px;padding:20px;text-align:center}
h1{font-size:38px;letter-spacing:4px;margin:10px 0;text-shadow:4px 4px 0 var(--glow);}
.sub{color:var(--dim);font-size:10px;margin-bottom:30px;letter-spacing:2px}
button{
  font-family:'Press Start 2P',monospace;background:var(--panel);color:var(--ink);
  border:3px solid var(--ink);padding:12px 18px;font-size:12px;cursor:pointer;
  box-shadow:5px 5px 0 var(--glow); margin:6px;
}
button:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--glow)}
button:disabled{opacity:.35;cursor:default;transform:none;box-shadow:5px 5px 0 var(--dim)}
.hidden{display:none!important}
#hud{display:flex;justify-content:space-between;font-size:10px;margin-bottom:18px;color:var(--dim)}
#hud b{color:var(--ink)}
#notebook{background:#fdf6e3;color:#3a2f1a;border:5px solid var(--ink);padding:16px 18px;margin-bottom:20px;box-shadow:5px 5px 0 rgba(0,0,0,.2);perspective:800px;text-align:left}
.nb-header{font-size:9px;letter-spacing:1px;color:#9a865a;margin-bottom:10px;display:flex;justify-content:space-between}
.nb-page{min-height:70px;display:flex;align-items:center}
.nb-page-inner{font-size:10px;line-height:1.8;transform-origin:left center;transition:transform .35s ease;backface-visibility:hidden;width:100%}
.nb-page-inner.flip{transform:rotateY(-100deg)}
.rule-neg{color:#b5354f}
.rule-pos{color:#2f8f5b}
#doors{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:10px;perspective:700px}
.door-frame{aspect-ratio:320/467;position:relative;cursor:pointer;background:transparent}
.door-inside{position:absolute;inset:0;background:var(--panel);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:1;color:#fff;font-size:10px;text-align:center;padding:4px}
.door-inside .amt{font-size:17px;margin-bottom:4px;color:#7dffb0}
.door-inside .msg{color:#ff6b7d;font-size:12px}
.door-leaf{position:absolute;inset:0;z-index:2;transform-origin:left center;transition:transform .35s ease-in;
  background-image:var(--door-img);background-size:100% 100%;background-repeat:no-repeat;image-rendering:pixelated}
.door-leaf.open{transform:rotateY(-100deg)}
.door-leaf .label{position:absolute;bottom:5px;left:50%;transform:translateX(-50%);font-size:8px;letter-spacing:1px;color:#fff;background:rgba(0,0,0,.55);padding:2px 5px;z-index:3;white-space:nowrap}
.eyeimg{position:absolute;background-image:var(--eye-img);background-size:contain;background-repeat:no-repeat;z-index:2;filter:drop-shadow(0 0 3px rgba(0,0,0,.6))}
.led-dot{position:absolute;width:5px;height:5px;background:#39ff9c;box-shadow:0 0 5px #39ff9c;z-index:2}
.horn{position:absolute;top:-2%;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-bottom:14px solid #2a0a10;z-index:3}
.halo{position:absolute;top:-7%;left:50%;transform:translateX(-50%);width:34px;height:12px;border:3px solid #e8c96a;border-radius:50%;z-index:3;background:transparent;box-shadow:0 0 8px #e8c96a}
.wing{position:absolute;top:12%;width:20px;height:32px;z-index:1}
.wing.wl{left:-8px;clip-path:polygon(100% 0%,0% 35%,45% 100%)}
.wing.wr{right:-8px;clip-path:polygon(0% 0%,100% 35%,55% 100%)}
.wing.devilw{background:#180810;box-shadow:0 0 6px rgba(0,0,0,.7)}
.wing.angelw{background:#fdf6e3;box-shadow:0 0 8px rgba(255,255,255,.5)}
.flame-i{position:absolute;bottom:3%;width:6px;height:13px;background:#c04dff;clip-path:polygon(50% 0%,0 100%,100% 100%);box-shadow:0 0 6px #c04dff;z-index:2}
.d-blue .door-leaf{filter:hue-rotate(150deg) saturate(1.5)}
.d-red .door-leaf{filter:hue-rotate(320deg) saturate(1.6)}
.d-rainbow .door-leaf{animation:huecycle 4s linear infinite;filter:saturate(2)}
.d-eyes .door-leaf{filter:hue-rotate(250deg) saturate(1.4) brightness(.85)}
.d-led .door-leaf{filter:grayscale(.4) brightness(.7)}
.d-devil .door-leaf{filter:hue-rotate(320deg) saturate(2.2) brightness(.7) contrast(1.15)}
.d-angel .door-leaf{filter:brightness(1.5) saturate(.35)}
.d-joker .door-leaf{filter:hue-rotate(255deg) saturate(2.2) brightness(1.05)}
.d-flame .door-leaf{filter:hue-rotate(210deg) saturate(1.8) brightness(.75)}
@keyframes huecycle{from{filter:hue-rotate(0deg) saturate(2)}to{filter:hue-rotate(360deg) saturate(2)}}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.card-box{background:var(--panel);border:3px solid var(--ink);padding:20px;max-width:520px;width:100%;box-shadow:6px 6px 0 var(--glow)}
.card-box h2{font-size:16px;margin-top:0;text-shadow:3px 3px 0 var(--glow)}
.card-box p{font-size:10px;line-height:1.7;color:var(--ink)}
.shopcards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:14px 0}
.shopcard{width:150px;padding:10px;border:3px solid #333;font-size:8px;text-align:left;cursor:pointer;line-height:1.6}
.shopcard b{display:block;font-size:9px;margin-bottom:6px}
.c1{background:#ffe1e1;border-color:#e23b3b}
.c2{background:#e1f0ff;border-color:#2f6fed}
.c3{background:#fff6d5;border-color:#e0a800}
.c4{background:#e1ffe8;border-color:#2fbf6b}
.c5{background:#f2e1ff;border-color:#8a2fdc}
.c6{background:#fff0f7;border-color:#d631c9}
.c7{background:#fff9e1;border-color:#e8c96a}
.c8{background:#2a0e3d;border-color:#c04dff;color:#fff}
.c9{background:#e1fbff;border-color:#3fb2c9}
.meta-row{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--dim);padding:10px;margin:8px 0;font-size:9px;text-align:left}
.meta-row div{flex:1}
.small{font-size:8px;color:var(--dim)}
</style>
</head>
<body>
<div id="app">

<div class="chain left"></div>
<div class="chain right"></div>

<div id="screen-title">
  <div class="candle"></div>
  <h1>DoomDoors</h1>
  <div class="rainbow-bar"></div>
  <div class="sub">six doors. one rule. no way back.</div>
  <button onclick="startRun()">PLAY</button><br>
  <button onclick="openMeta()">UPGRADES</button>
</div>

<div id="screen-game" class="hidden">
  <div id="hud"><span>ROOM <b id="round">0</b></span><span>$<b id="money">0</b></span></div>
  <div id="notebook">
    <div class="nb-header"><span>RULE BOOK</span><span><span id="ruleCount">0</span> pages</span></div>
    <div class="nb-page"><div class="nb-page-inner" id="rulePageInner">No rule yet.</div></div>
  </div>
  <div id="doors"></div>
</div>

<div id="screen-meta" class="hidden">
  <h1 style="font-size:20px">UPGRADES</h1>
  <div class="sub">rule points: <span id="rp">0</span></div>
  <div id="metalist"></div>
  <button onclick="backTitle()">BACK</button>
</div>

<div id="overlay" class="hidden"></div>
</div>

<script>
// ---------- persistent meta state ----------
let meta = {rp:0, moneyLvl:0, safeLvl:0};
try{ const s=localStorage.getItem('hexdoor_meta'); if(s) meta=JSON.parse(s); }catch(e){}
function saveMeta(){ try{ localStorage.setItem('hexdoor_meta', JSON.stringify(meta)); }catch(e){} }

const MONEY_MAX=10, SAFE_MAX=10; // 10 purchases each
function moneyBonus(){ return meta.moneyLvl*0.02; }        // +2% per lvl
function baseEndChance(){ return Math.max(0.10 - meta.safeLvl*0.005, 0.02); } // -0.5%/lvl from 10%

// ---------- statistics (persisted, old saves get safe defaults) ----------
if(!meta.stats) meta.stats = {runs:0, doorsByType:{}, positiveEvents:0, negativeEvents:0};

// ---------- generic event system ----------
// event = { id, type: 'reward'|'damage'|'heal'|..., execute(run, meta) }
function runEvent(event){
  if(!event || typeof event.execute!=='function') return;
  event.execute(run, meta);
  if(event.type==='reward' || event.type==='heal') meta.stats.positiveEvents++;
  if(event.type==='damage') meta.stats.negativeEvents++;
  saveMeta();
}

// ---------- generic rule hooks ----------
// a rule MAY define validate(run,door), onDoorSelected(run,door), onRoomStart(run), onRoomEnd(run)
function callRuleHook(hook, ...args){
  run.rules.forEach(r=>{ if(typeof r[hook]==='function') r[hook](run, ...args); });
}
function ruleBlocksDoor(door){
  return run.rules.some(r=> typeof r.validate==='function' && r.validate(run, door)===false);
}
function flashBlocked(frame){
  const msgEl=frame.querySelector('.msg');
  msgEl.textContent='BLOCKED';
  setTimeout(()=>{ if(msgEl) msgEl.textContent=''; },600);
}

// ---------- locations (unlocked with rule points) ----------
const LOCATIONS=[
  {name:'The Hut', cost:0, mult:1.0, unlocks:['blue','red','rainbow','eyes','led']},
  {name:'The House', cost:15, mult:1.15, unlocks:['devil']},
  {name:'The Mysterious House', cost:40, mult:1.35, unlocks:['angel']},
  {name:'The Old Castle', cost:90, mult:1.6, unlocks:['joker']},
  {name:'The Endless Corridor', cost:170, mult:2.0, unlocks:['flame']},
];
if(meta.locationLvl===undefined) meta.locationLvl=0;
function locationMult(){ return LOCATIONS[meta.locationLvl].mult; }
function unlockedTypes(){
  let ids=[];
  for(let i=0;i<=meta.locationLvl;i++) ids=ids.concat(LOCATIONS[i].unlocks);
  return ids;
}

// ---------- door types ----------
const DOOR_TYPES=[
 {id:'blue',cls:'d-blue',name:'Blue'},
 {id:'red',cls:'d-red',name:'Red'},
 {id:'rainbow',cls:'d-rainbow',name:'Rainbow'},
 {id:'eyes',cls:'d-eyes',name:'Eyed'},
 {id:'led',cls:'d-led',name:'LED'},
 {id:'devil',cls:'d-devil',name:'Devil'},
 {id:'angel',cls:'d-angel',name:'Angel'},
 {id:'joker',cls:'d-joker',name:'Joker'},
 {id:'flame',cls:'d-flame',name:'Flame'},
];

// ---------- rule pool ----------
function rulePool(){
  const t=DOOR_TYPES;
  return [
    ...t.map(d=>{const mod=0.15+Math.random()*0.25; return {neg:true,type:d.id,mod,
      text:`${d.name} doors have +${Math.round(mod*100)}% chance to end the run`};}),
    {neg:false, effect:'remove', text:'You may remove one rule from this run'},
    {neg:false, effect:'peek', text:'You already know every rule in this run'},
    {neg:false, effect:'safedoor', type:t[Math.floor(Math.random()*t.length)].id, mod:0.2,
      text:'One door type becomes 20% safer this run'},
    {neg:false, effect:'bonusmoney', mod:15, text:'+15 bonus money right now'},
    {neg:true, type:'all', mod:0.08, text:'All doors have +8% chance to end the run'},
    {neg:true, effect:'streak', mod:5, text:'Open the same door type 5 times in a row and the run ends'},
    {neg:false, effect:'fastrules', text:'From now on a new rule appears every 7 doors instead of 5'},
    {neg:false, effect:'fastshop', text:'From now on the shop appears every 7 doors instead of 10'},
  ];
}
function randomStarterRule(){
  const picks=rulePool().filter(r=>r.neg && r.type!=='all');
  return picks[Math.floor(Math.random()*picks.length)];
}

// ---------- run state ----------
let run=null;
function startRun(){
  run={round:0, money:0, rules:[], doorsOpened:0, over:false, moneyMult:1, shield:0,
       ruleInterval:5, shopInterval:10, lastType:null, streak:0, doorHistory:[],
       upgrades:[], discoveredSecrets:[]};
  run.rules.push(randomStarterRule());
  show('screen-game');
  nextRound();
}
function backTitle(){ show('screen-title'); }
function openMeta(){ renderMeta(); show('screen-meta'); }

function show(id){
  ['screen-title','screen-game','screen-meta'].forEach(s=>document.getElementById(s).classList.toggle('hidden', s!==id));
  document.getElementById('overlay').classList.add('hidden');
}

function renderRules(animate){
  const cnt=document.getElementById('ruleCount');
  if(cnt) cnt.textContent=run.rules.length;
  const inner=document.getElementById('rulePageInner');
  const latest=run.rules[run.rules.length-1];
  const html = latest ? `<span class="${latest.neg?'rule-neg':'rule-pos'}">${latest.neg?'⚠':'✦'} ${latest.text}</span>` : 'No rule yet.';
  if(animate){
    inner.classList.add('flip');
    setTimeout(()=>{ inner.innerHTML=html; inner.classList.remove('flip'); },200);
  } else {
    inner.innerHTML = html;
  }
}

function nextRound(){
  busy=false;
  run.round++;
  document.getElementById('round').textContent=run.round;
  document.getElementById('money').textContent=run.money;
  callRuleHook('onRoomStart');
  renderRules(false);
  const doorsEl=document.getElementById('doors');
  doorsEl.innerHTML='';
  const avail=DOOR_TYPES.filter(d=>unlockedTypes().includes(d.id));
  for(let i=0;i<6;i++){
    const d=avail[Math.floor(Math.random()*avail.length)];
    const frame=document.createElement('div');
    frame.className='door-frame '+d.cls;
    frame.innerHTML=`
      <div class="door-inside"><div class="amt"></div><div class="msg"></div></div>
      <div class="door-leaf">
        ${d.id==='eyes' ? `
          <div class="eyeimg" style="top:9%;left:18%;width:22px;height:16px;transform:rotate(-4deg)"></div>
          <div class="eyeimg" style="top:7%;right:14%;width:16px;height:12px;transform:rotate(9deg)"></div>
          <div class="eyeimg" style="top:36%;left:8%;width:14px;height:10px;transform:rotate(14deg)"></div>
          <div class="eyeimg" style="top:52%;right:10%;width:20px;height:15px;transform:rotate(-7deg)"></div>
          <div class="eyeimg" style="top:74%;left:28%;width:12px;height:9px;transform:rotate(3deg)"></div>
        ` : ''}
        ${d.id==='led' ? '<div class="led-dot" style="top:18%;left:20%"></div><div class="led-dot" style="top:18%;right:20%"></div><div class="led-dot" style="top:42%;left:12%"></div><div class="led-dot" style="top:42%;right:12%"></div><div class="led-dot" style="top:66%;left:20%"></div><div class="led-dot" style="top:66%;right:20%"></div>' : ''}
        ${d.id==='devil' ? '<div class="horn" style="left:24%"></div><div class="horn" style="right:24%"></div><div class="wing wl devilw"></div><div class="wing wr devilw"></div>' : ''}
        ${d.id==='angel' ? '<div class="halo"></div><div class="wing wl angelw"></div><div class="wing wr angelw"></div>' : ''}
        ${d.id==='flame' ? '<div class="flame-i" style="left:14%"></div><div class="flame-i" style="left:32%;height:17px;bottom:5%"></div><div class="flame-i" style="left:50%;height:20px;bottom:2%"></div><div class="flame-i" style="left:68%;height:17px;bottom:5%"></div><div class="flame-i" style="left:84%"></div>' : ''}
        <div class="label">${d.name}</div>
      </div>`;
    frame.onclick=()=>openDoor(d, frame);
    doorsEl.appendChild(frame);
  }
}

function endChanceFor(type){
  let c=baseEndChance();
  run.rules.forEach(r=>{
    if(r.neg && (r.type===type || r.type==='all')) c+=r.mod;
    if(!r.neg && r.effect==='safedoor' && r.type===type) c-=r.mod;
  });
  return Math.min(Math.max(c,0.01),0.95);
}

let busy=false;
function openDoor(d, frame){
  if(busy) return;
  if(ruleBlocksDoor(d)){ flashBlocked(frame); return; }
  busy=true;
  const leaf=frame.querySelector('.door-leaf');
  const amtEl=frame.querySelector('.amt');
  const msgEl=frame.querySelector('.msg');
  leaf.classList.add('open');

  if(run.lastType===d.id) run.streak=(run.streak||0)+1; else run.streak=1;
  run.lastType=d.id;
  run.doorHistory.push(d.id);
  meta.stats.doorsByType[d.id]=(meta.stats.doorsByType[d.id]||0)+1;
  callRuleHook('onDoorSelected', d);

  const chance=endChanceFor(d.id);
  run.doorsOpened++;
  const streakRule=run.rules.find(r=>r.effect==='streak');
  const streakDeath = streakRule && run.streak>=streakRule.mod;
  const died = Math.random()<chance || streakDeath;

  setTimeout(()=>{
    let survived = !died;
    if(died && run.shield>0){ run.shield--; survived=true; amtEl.textContent='🛡'; msgEl.textContent='SAVED'; }
    if(!survived){
      amtEl.textContent='☠'; msgEl.textContent='LOST';
      setTimeout(()=>runOver(), 550);
      return;
    }
    if(!died){
      const gain=Math.round((8+Math.random()*20)*(1+moneyBonus())*(run.moneyMult||1)*locationMult());
      run.money+=gain;
      amtEl.textContent='+$'+gain;
      document.getElementById('money').textContent=run.money;
    }

    setTimeout(()=>{
      if(run.doorsOpened%run.ruleInterval===0){
        let pool=rulePool();
        if(run.forcePositive){ pool=pool.filter(r=>!r.neg); run.forcePositive=false; }
        const newRule=pool[Math.floor(Math.random()*pool.length)];
        if(newRule.effect==='bonusmoney'){ run.money+=newRule.mod; }
        else if(newRule.effect==='remove' && run.rules.length){
          run.rules.splice(Math.floor(Math.random()*run.rules.length),1);
        } else {
          run.rules.push(newRule);
          if(newRule.effect==='fastrules') run.ruleInterval=7;
          if(newRule.effect==='fastshop') run.shopInterval=7;
        }
        renderRules(true);
        popup(`NEW RULE`, newRule.text, ()=>{
          callRuleHook('onRoomEnd');
          if(run.doorsOpened%run.shopInterval===0) openShop(); else nextRound();
        });
        return;
      }
      if(run.doorsOpened%run.shopInterval===0){ callRuleHook('onRoomEnd'); openShop(); return; }
      callRuleHook('onRoomEnd');
      nextRound();
    }, 600);
  }, 320);
}

function popup(title, text, onClose){
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML=`<div class="card-box"><h2>${title}</h2><p>${text}</p><button id="okbtn">OK</button></div>`;
  document.getElementById('okbtn').onclick=()=>{ov.classList.add('hidden'); onClose&&onClose();};
}

// ---------- shop (spend in-run money on cards) ----------
const CARD_DEFS=[
  {cls:'c1', name:'Steel Hinges', desc:'-10% end chance on all doors (this run)', cost:40, apply:()=>run.rules.push({neg:false,effect:'safeall',mod:0.1,text:'Steel Hinges: -10% end chance everywhere'})},
  {cls:'c2', name:'Lucky Coin', desc:'+25% money from doors (this run)', cost:35, apply:()=>run.moneyMult=(run.moneyMult||1)+0.25},
  {cls:'c3', name:'Old Map', desc:'Reveals a door type before choosing (flavor)', cost:20, apply:()=>{}},
  {cls:'c4', name:'Rabbit Foot', desc:'Instantly gain 30 money', cost:15, apply:()=>run.money+=30},
  {cls:'c5', name:'Cursed Key', desc:'Remove your riskiest rule', cost:55, apply:()=>{
    let worst=null; run.rules.forEach(r=>{if(r.neg&&(!worst||r.mod>worst.mod))worst=r;});
    if(worst) run.rules.splice(run.rules.indexOf(worst),1);
  }},
  {cls:'c6', name:"Joker's Grin", desc:'Your next new rule is guaranteed positive', cost:45, apply:()=>run.forcePositive=true},
  {cls:'c7', name:'Guardian Halo', desc:'Survive your next death once (this run)', cost:70, apply:()=>run.shield=(run.shield||0)+1},
  {cls:'c8', name:"Devil's Bargain", desc:'+40% money, but all doors +10% end chance', cost:30, apply:()=>{run.moneyMult=(run.moneyMult||1)+0.4; run.rules.push({neg:true,type:'all',mod:0.1,text:"Devil's Bargain: all doors +10% end chance"});}},
  {cls:'c9', name:'Fourth Wall', desc:'Instantly gain 45 money', cost:25, apply:()=>run.money+=45},
];
function openShop(){
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  const picks=[...CARD_DEFS].sort(()=>Math.random()-0.5).slice(0,3);
  ov.innerHTML=`<div class="card-box"><h2>SHOP — $${run.money}</h2><p>Buy permanent boosts for this run.</p>
    <div class="shopcards">${picks.map((c,i)=>`<div class="shopcard ${c.cls}" data-i="${i}"><b>${c.name}</b>${c.desc}<br><br>Cost: $${c.cost}</div>`).join('')}</div>
    <button id="leaveShop">CONTINUE</button></div>`;
  picks.forEach((c,i)=>{
    ov.querySelector(`[data-i="${i}"]`).onclick=()=>{
      if(run.money>=c.cost){ run.money-=c.cost; c.apply(); c.bought=true; ov.querySelector(`[data-i="${i}"]`).style.opacity=.3; }
    };
  });
  document.getElementById('leaveShop').onclick=()=>{ ov.classList.add('hidden'); nextRound(); };
}

function runOver(){
  const points = run.rules.length*3 + run.round;
  meta.rp += points;
  meta.stats.runs++;
  saveMeta();
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.innerHTML=`<div class="card-box"><h2>RUN OVER</h2>
    <p>You survived ${run.round} rounds and carried ${run.rules.length} rules.</p>
    <p style="color:var(--glow)">+${points} RULE POINTS</p>
    <button onclick="backTitle()">TITLE</button>
    <button onclick="openMeta()">UPGRADES</button></div>`;
}

// ---------- meta shop ----------
function metaCost(lvl){ return 10 + lvl*8; }
function renderMeta(){
  document.getElementById('rp').textContent=meta.rp;
  const el=document.getElementById('metalist');
  el.innerHTML='';
  el.appendChild(metaRow(`+2% Money per door (Lvl ${meta.moneyLvl}/${MONEY_MAX})`, meta.moneyLvl<MONEY_MAX?metaCost(meta.moneyLvl):null, ()=>{meta.moneyLvl++;}));
  el.appendChild(metaRow(`-0.5% base door end chance (Lvl ${meta.safeLvl}/${SAFE_MAX}) — now ${(baseEndChance()*100).toFixed(1)}%`, meta.safeLvl<SAFE_MAX?metaCost(meta.safeLvl):null, ()=>{meta.safeLvl++;}));
  const next=LOCATIONS[meta.locationLvl+1];
  if(next){
    el.appendChild(metaRow(`Unlock ${next.name} (+${Math.round((next.mult-1)*100)}% money, new door types)`, next.cost, ()=>{meta.locationLvl++;}));
  } else {
    el.appendChild(metaRow(`${LOCATIONS[meta.locationLvl].name} — all locations unlocked`, null, ()=>{}));
  }
}
function metaRow(label, cost, onBuy){
  const div=document.createElement('div');
  div.className='meta-row';
  div.innerHTML=`<div>${label}</div>`;
  const btn=document.createElement('button');
  if(cost===null){ btn.textContent='MAX'; btn.disabled=true; }
  else{
    btn.textContent=`${cost} RP`;
    btn.disabled = meta.rp<cost;
    btn.onclick=()=>{ if(meta.rp>=cost){ meta.rp-=cost; onBuy(); saveMeta(); renderMeta(); } };
  }
  div.appendChild(btn);
  return div;
}
</script>
